[workspace]
members = ["crates/dr-core", "crates/dr-editor"]
resolver = "2"

[workspace.package]
edition = "2024"
license = "MPL-2.0"

[workspace.dependencies]
anyhow = "1"
bevy = { version = "0.19", default-features = false, features = ["default_app", "bevy_winit", "2d_bevy_render", "ui_bevy_render", "default_font", "multi_threaded", "std"] }
quick-xml = { version = "0.39", features = ["serialize"] }
serde = { version = "1", features = ["derive"] }
thiserror = "2"

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3
