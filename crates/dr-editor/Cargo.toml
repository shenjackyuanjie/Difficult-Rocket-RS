[package]
name = "dr-editor"
version = "0.1.0"
edition.workspace = true
license.workspace = true

[dependencies]
anyhow.workspace = true
serde_json = "1"
bevy.workspace = true
dr-core = { path = "../dr-core" }
rfd = "0.17"
# 将 ICU4X 的已知轻量分词告警接入 Bevy 日志，避免直接 stderr 刷屏。
icu_provider = { version = "2.3", features = ["logging"] }
bevy_egui = { version = "0.42", default-features = false, features = ["render", "default_fonts", "manage_clipboard", "bevy_ui"] }

[target.'cfg(windows)'.dependencies]
raw-window-handle = "0.6"
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Globalization", "Win32_UI_Input_Ime", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_WindowsAndMessaging"] }

[dev-dependencies]
tempfile = "3"
